<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HR12 · Hard Reset · Vinícius</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg2);color:var(--text);font-size:14px;transition:background .3s,color .3s;min-height:100vh}
:root{--g:#0F6E56;--gBg:#E1F5EE;--gAcc:#1D9E75;--b:#185FA5;--bBg:#E6F1FB;--a:#854F0B;--aBg:#FAEEDA;--aAcc:#BA7517;--p:#534AB7;--pBg:#EEEDFE;--pAcc:#7F77DD;--r:#993556;--rBg:#FBEAF0}
[data-theme=light]{--bg:#fff;--bg2:#f8fafc;--bg3:#f1f5f9;--text:#0f172a;--ts:#64748b;--bd:#e2e8f0;--sh:0 1px 4px rgba(0,0,0,.06);--card:#fff}
[data-theme=dark]{--bg:#0f172a;--bg2:#1e293b;--bg3:#273549;--text:#f1f5f9;--ts:#94a3b8;--bd:#334155;--sh:0 1px 4px rgba(0,0,0,.3);--card:#1e293b;--gBg:#052e16;--bBg:#0f2543;--aBg:#3a1500;--pBg:#1a1536;--rBg:#2d0a16}
#app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--bd);display:none;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 0;overflow:auto}
.sidebar-logo{padding:0 18px 22px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.sidebar-logo .hr12{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-1px;line-height:1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.sidebar-logo .hr12 span{color:#1D9E75}
.sidebar-logo .hr12-sub{display:flex;align-items:center;gap:6px;margin-top:5px}
.sidebar-logo .hr12-line{height:1px;background:var(--bd);flex:1}
.sidebar-logo .hr12-label{font-size:8px;color:var(--ts);letter-spacing:3.5px;white-space:nowrap}
.sb-nav{flex:1;padding:0 10px}
.sb-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:0;border:none;border-left:2.5px solid transparent;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--ts);margin-bottom:1px;text-align:left;transition:all .15s}
.sb-btn:hover{background:var(--bg2);color:var(--text)}
.sb-btn.on{background:var(--bg2);color:var(--text);font-weight:700;border-left-color:var(--text)}
.sb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
.sb-footer{padding:12px 10px;border-top:1px solid var(--bd);margin-top:auto}
/* MAIN */
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;max-width:100%}
.hdr{padding:14px 20px 12px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hdr-left h1{font-size:18px;font-weight:700;color:var(--text)}
.hdr-left p{font-size:12px;color:var(--ts);margin-top:2px}
.theme-btn{padding:7px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ts)}
.theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
/* PANELS */
.pnl{display:none;padding:20px;flex:1}
.pnl.on{display:block}
/* BOTTOM NAV (mobile) */
.nav{display:flex;background:var(--bg);border-top:1px solid var(--bd);position:fixed;bottom:0;left:0;right:0;z-index:99}
.nb{flex:1;padding:9px 2px 7px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--ts);transition:color .15s}
.nb.on{color:var(--text)}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
/* DESKTOP GRID */
@media(min-width:768px){
  body{padding-bottom:0}
  .sidebar{display:flex}
  .nav{display:none}
  .pnl{padding:24px 28px}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dash-grid .span2{grid-column:span 2}
  .stats4{grid-template-columns:repeat(4,1fr)!important}
  .sum-grid{grid-template-columns:repeat(4,1fr)!important}
  .meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .meal-grid .meal-full{grid-column:span 2}
}
@media(max-width:767px){.main-area{padding-bottom:68px}}
/* CARDS */
.card{background:var(--card,var(--bg));border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card-accent{border-radius:14px;padding:16px;margin-bottom:12px}
.st{font-size:10px;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:12px}
/* SEGMENTS */
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-bottom:14px;background:var(--bg2)}
.seg button{flex:1;padding:7px 4px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--ts);transition:all .15s}
.seg button:not(:last-child){border-right:1px solid var(--bd)}
.seg button.on{background:var(--gBg);color:var(--g);font-weight:700}
/* PILLS */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:500;border-radius:20px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--ts);white-space:nowrap;transition:all .15s}
.pill.on{background:var(--gBg);color:var(--g);border-color:var(--gAcc);font-weight:700}
.pill.onb{background:var(--bBg);color:var(--b);border-color:var(--b);font-weight:700}
.pill.onp{background:var(--pBg);color:var(--p);border-color:var(--p);font-weight:700}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{border-radius:12px;padding:14px 12px}
.kpi-v{font-size:22px;font-weight:800}
.kpi-l{font-size:11px;color:var(--ts);margin-top:3px}
/* PHASE PROGRESS */
.ph-bar-wrap{height:7px;background:var(--bg2);border-radius:4px}
.ph-bar{height:100%;border-radius:4px;transition:width .5s}
/* EXERCISE ROWS */
.ex-row{display:grid;grid-template-columns:30px 1fr auto;gap:0 12px;padding:13px 0;border-bottom:1px solid var(--bd);align-items:start}
.ex-row:last-child{border-bottom:none}
.chk{width:28px;height:28px;border-radius:8px;cursor:pointer;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--bg);user-select:none}
.chk.ck{border:none}
.ex-name{font-size:13px;font-weight:600;line-height:1.3;color:var(--text)}
.ex-name.ck{text-decoration:line-through;opacity:.35}
.ex-sets{font-size:12px;font-weight:600;margin-top:4px}
.ex-tip{font-size:11px;color:var(--ts);margin-top:3px;line-height:1.45}
.ex-fields{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fl{display:flex;flex-direction:column;align-items:center;gap:2px}
.fl span{font-size:9px;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.4px}
.fl input{font-size:13px;padding:5px 6px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--text);width:80px;text-align:center}
.pbar-wrap{height:5px;background:var(--bg2);border-radius:3px;margin:10px 0 16px}
.pbar{height:100%;border-radius:3px;transition:width .3s}
.ok-msg{border-radius:12px;padding:12px;font-size:13px;font-weight:600;text-align:center;margin-top:10px}
.fwu{display:flex;align-items:center;border:0.5px solid var(--bd);border-radius:7px;overflow:hidden;background:var(--bg2);width:90px}
.fwu input{font-size:13px;padding:5px 5px;border:none;background:transparent;color:var(--text);width:52px;text-align:center}
.fwu input:focus{outline:none}
.fwu .fu{font-size:10px;font-weight:600;padding:5px 6px;border-left:0.5px solid var(--bd);color:var(--ts);white-space:nowrap}
.nota-inp{width:100%;font-size:11px;padding:4px 8px;border-radius:6px;border:0.5px solid var(--bd);background:transparent;color:var(--text);margin-top:6px}
.nota-inp::placeholder{color:var(--ts)}
.last-sess{font-size:10px;color:var(--ts);margin-top:3px;font-style:italic}
.prot-bar-w{height:6px;background:var(--bg2);border-radius:3px;margin:6px 0 2px;overflow:hidden;border:0.5px solid var(--bd)}
.prot-bar-f{height:100%;border-radius:3px;background:#1D9E75;transition:width .5s}
.today-banner{border:1.5px solid #1D9E75;border-radius:12px;padding:14px;margin-bottom:12px}
.nutri-summary{background:var(--bg2);border:0.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
/* MEALS */
.mc{background:var(--card,var(--bg));border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.mc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.mc-name{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1;overflow:hidden}
.mc-name b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.mc-dot{color:var(--bd);flex-shrink:0}
.mc-time{font-size:12px;color:var(--ts);white-space:nowrap;flex-shrink:0}
.ob{display:flex;gap:4px;flex-shrink:0}
.ob button{font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--ts);transition:all .15s}
.ob button.on{background:var(--bBg);color:var(--b);border-color:var(--b)}
.mi{list-style:none;margin-bottom:10px}
.mi li{font-size:13px;padding:2px 0;display:flex;gap:6px;line-height:1.5;color:var(--text)}
.mi li::before{content:"·";color:var(--b);flex-shrink:0}
.mmac{display:flex;gap:12px;font-size:11px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--bd)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.tb-total{background:var(--bg2);border-radius:12px;padding:14px;margin-top:8px;border:1px solid var(--bd)}
.tb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.tb-v{font-size:18px;font-weight:700;color:var(--text)}
.tb-l{font-size:10px;color:var(--ts);margin-top:1px}
/* FOOD DIARY */
.diary-toggle{width:100%;margin-top:10px;padding:8px;font-size:12px;font-weight:500;border-radius:8px;border:1px dashed var(--bd);background:transparent;cursor:pointer;color:var(--ts);text-align:center;transition:all .15s}
.diary-toggle:hover{border-color:var(--gAcc);color:var(--g)}
.diary-section{border-top:1px solid var(--bd);margin-top:10px;padding-top:10px;display:none}
.diary-section.open{display:block}
.diary-items{margin-bottom:10px}
.diary-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px;color:var(--ts)}
.diary-item:last-child{border-bottom:none}
.add-food-grid{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;margin-bottom:8px}
.add-food-grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.add-food-grid input,.add-food-grid2 input{font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--text);width:100%}
.add-food-grid input::placeholder,.add-food-grid2 input::placeholder{color:var(--ts)}
.diary-add-btn{width:100%;padding:7px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--bg2);color:var(--ts);border:1px solid var(--bd);margin-bottom:8px}
.diary-confirm-btn{width:100%;padding:9px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--gBg);color:var(--g);border:1px solid var(--gAcc)}
.diary-totals{background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:11px;margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.diary-compare{font-size:11px;color:var(--ts);margin-bottom:8px;line-height:1.6}
.food-datalist-input{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--text);width:100%}
/* REPORTS */
.sub-nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub-nav::-webkit-scrollbar{display:none}
.spill{flex-shrink:0;padding:7px 14px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--bd);cursor:pointer;background:var(--bg);color:var(--ts);transition:all .15s}
.spill.on{background:var(--pBg);color:var(--p);border-color:var(--p);font-weight:700}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-card{border-radius:12px;padding:12px 14px}
.sum-v{font-size:22px;font-weight:800}
.sum-l{font-size:12px;font-weight:600;margin-top:2px;color:var(--text)}
.sum-s{font-size:11px;color:var(--ts);margin-top:1px}
.hm{display:flex;gap:4px}
.hm-days{display:flex;flex-direction:column;gap:3px;padding-top:22px}
.hm-days span{font-size:9px;color:var(--ts);height:18px;display:flex;align-items:center}
.hm-col{flex:1;display:flex;flex-direction:column;gap:3px}
.hm-wl{font-size:8px;color:var(--ts);text-align:center;margin-bottom:2px}
.hm-cell{height:18px;border-radius:4px}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-hdr span{text-align:center;font-size:9px;font-weight:700;color:var(--ts);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text)}
.cal-day.done{background:var(--gAcc);color:#fff;font-weight:700}
.cal-day.rest{background:var(--bg2);color:var(--ts)}
.cal-day.future{color:var(--bd)}
.msel{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.msel button{padding:6px 14px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--bd);cursor:pointer;background:transparent;transition:all .15s}
.cmp-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.cmp-row:last-child{border-bottom:none}
.mb-row{margin-bottom:12px}
.mb-bar{height:9px;background:var(--bg2);border-radius:5px;margin-top:5px}
.mb-fill{height:100%;border-radius:5px}
/* CORPO */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mf label{font-size:11px;font-weight:600;color:var(--ts);display:block;margin-bottom:4px}
.mf input{font-size:15px;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg2);color:var(--text);width:100%}
.sv-btn{width:100%;padding:12px;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;background:var(--gBg);color:var(--g);border:1px solid var(--gAcc)}
.hc{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--bd)}
.hc-hdr{font-size:11px;font-weight:600;color:var(--ts);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hc-vals{display:flex;flex-wrap:wrap;gap:16px}
.hc-v{font-size:16px;font-weight:700}
.hc-l{font-size:10px;color:var(--ts)}
/* TIMELINE */
.tl-item{display:flex;gap:12px;margin-bottom:4px}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tl-line{width:2px;flex:1;min-height:16px;background:var(--bd);margin:4px 0}
.tl-note{font-size:12px;color:var(--ts);background:var(--bg2);border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.5;border:1px solid var(--bd)}
.tl-content{flex:1;padding-bottom:12px}
/* MISC */
.banner{border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.export-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--ts);width:100%;margin-bottom:10px;transition:all .15s}
.export-btn:hover{border-color:var(--gAcc);color:var(--g)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ts)}
.empty-state svg{width:40px;height:40px;margin-bottom:10px;stroke:currentColor;fill:none;stroke-width:1.4;opacity:.5}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-lbl{font-size:10px;color:var(--ts);text-align:center;margin-bottom:6px}
.wk-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center}
.wk-cell.done{background:var(--gAcc)}
.wk-cell.empty{background:var(--bg2)}
canvas{display:block;max-width:100%}
.ch-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}.ch-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;border:0.5px solid;white-space:nowrap}.ch-bar{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}.ch-bar-fill{height:100%;border-radius:4px;transition:width .5s}.ch-btn{padding:6px 12px;font-size:11px;border-radius:7px;border:0.5px solid var(--bd);cursor:pointer;background:var(--bg2);color:var(--ts)}.ch-btn.on{background:var(--gBg);color:var(--g);border-color:var(--gAcc)}.ch-form{background:var(--bg2);border:0.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}.ch-field{margin-bottom:10px}.ch-field label{font-size:11px;color:var(--ts);display:block;margin-bottom:4px}.ch-field input,.ch-field select,.ch-field textarea{width:100%;padding:8px 10px;border-radius:8px;border:0.5px solid var(--bd);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="hr12">HR<span>12</span></div>
      <div class="hr12-sub">
        <div class="hr12-line"></div>
        <div class="hr12-label">HARD RESET</div>
        <div class="hr12-line"></div>
      </div>
    </div>
    <nav class="sb-nav">
      <button class="sb-btn on" id="sb-dashboard" onclick="go('dashboard')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Início</button>
      <button class="sb-btn" id="sb-treino" onclick="go('treino')"><svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M6 12h12M2 7h4M18 7h4M2 17h4M18 17h4"/></svg>Treino</button>
      <button class="sb-btn" id="sb-nutricao" onclick="go('nutricao')"><svg viewBox="0 0 24 24"><path d="M12 2C9 2 6 4.5 6 8c0 2.5 1.5 4.5 3 5.5L8 20h8l-1.5-6.5C17 12.5 18 10.5 18 8c0-3-3-6-6-6z"/></svg>Nutrição</button>
      <button class="sb-btn" id="sb-relatorios" onclick="go('relatorios')"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Relatórios</button>

function toggleEx(i){const cur=getCurWD();cur.ch={...cur.ch,[i]:!cur.ch[i]};saveCurWD(cur);renderTreino();}
function setKg(i,v){const cur=getCurWD();cur.wt={...cur.wt,[i]:v};saveCurWD(cur);}
function setNota(i,v){const cur=getCurWD();cur.no={...cur.no,[i]:v};saveCurWD(cur);}
function setTm(i,v){const cur=getCurWD();cur.tm={...cur.tm,[i]:v};saveCurWD(cur);}
function getLastSession(phase,day){
  const log=getLog();
  const prev=log.find(e=>e.phase===phase&&e.day===day&&e.exercises);
  if(!prev)return {};
  const map={};
  (prev.exercises||[]).forEach((e,i)=>{if(e.kg)map[i]=e.kg;});
  return map;
}
function selPhase(n){S.phase=n;S.day=0;renderTreino();}
function selDay(i){S.day=i;renderTreino();}

// MEAL HELPERS
function mcKey(){return `${S.week}_${S.mday}`;}
function getCurMC(){const d=getMC();return d[mcKey()]||{};}
function saveCurMC(upd){const d=getMC();d[mcKey()]=upd;saveMC(d);}
function chooseMeal(mi,option){const d=getCurMC();d[mi]=option;saveCurMC(d);renderNutricao();}
function selWeek(w){S.week=w;renderNutricao();}
function selMday(i){S.mday=i;renderNutricao();}

// FOOD DIARY
function toggleDiary(id){const el=document.getElementById('diary-'+id);if(el){el.classList.toggle('open');const btn=el.previousElementSibling;btn.textContent=el.classList.contains('open')?'▲ Fechar diário':'📝 Registrar o que comi';}}
function getDiaryKey(mi){return `${today()}_${S.week}_${S.mday}_${mi}`;}
function getDiaryItems(mi){const d=getDiary();return d[getDiaryKey(mi)]||[];}
function saveDiaryItems(mi,items){const d=getDiary();d[getDiaryKey(mi)]=items;saveDiary(d);}

function onFoodInput(mi){
  const name=document.getElementById(`fn-${mi}`).value.trim();
  const macros=FOODS_DB[name];
  if(macros){
    document.getElementById(`fk-${mi}`).placeholder=`${macros[0]} kcal/100g`;
    document.getElementById(`fp-${mi}`).placeholder=`${macros[1]}g P`;
    document.getElementById(`fc-${mi}`).placeholder=`${macros[2]}g C`;
    document.getElementById(`ff-${mi}`).placeholder=`${macros[3]}g G`;
  }
}

function addFoodEntry(mi){
  const name=document.getElementById(`fn-${mi}`).value.trim();
  const qty=parseFloat(document.getElementById(`fq-${mi}`).value)||0;
  const kcalRaw=parseFloat(document.getElementById(`fk-${mi}`).value)||0;
  const pRaw=parseFloat(document.getElementById(`fp-${mi}`).value)||0;
  const cRaw=parseFloat(document.getElementById(`fc-${mi}`).value)||0;
  const fRaw=parseFloat(document.getElementById(`ff-${mi}`).value)||0;
  if(!name||qty<=0){alert('Informe o alimento e a quantidade.');return;}
  // Check if food is in DB - use per 100g logic
  const inDB=FOODS_DB[name];
  let kcal,p,c,f;
  if(inDB&&kcalRaw===0){
    // use DB values per 100g * qty/100
    const factor=qty/100;
    kcal=Math.round(inDB[0]*factor);p=+(inDB[1]*factor).toFixed(1);c=+(inDB[2]*factor).toFixed(1);f=+(inDB[3]*factor).toFixed(1);
  } else if(kcalRaw>0&&qty>0){
    // user entered kcal/100g manually
    const factor=qty/100;
    kcal=Math.round(kcalRaw*factor);p=+(pRaw*factor).toFixed(1);c=+(cRaw*factor).toFixed(1);f=+(fRaw*factor).toFixed(1);
  } else {
    alert('Informe as calorias por 100g para calcular.');return;
  }
  const items=getDiaryItems(mi);
  items.push({name,qty,kcal,p,c,f,ts:Date.now()});
  saveDiaryItems(mi,items);
  ['fn','fq','fk','fp','fc','ff'].forEach(id=>{const el=document.getElementById(`${id}-${mi}`);if(el){el.value='';el.placeholder=el.getAttribute('data-ph')||'';}});
  renderDiarySection(mi);
}

function removeFoodEntry(mi,idx){
  const items=getDiaryItems(mi);items.splice(idx,1);saveDiaryItems(mi,items);renderDiarySection(mi);
}

function confirmMealDiary(mi){
  const items=getDiaryItems(mi);
  if(!items.length){alert('Adicione pelo menos um alimento antes de confirmar.');return;}
  const d=getDiary();
  const key=getDiaryKey(mi);
  d[key]=items.map(i=>({...i,confirmed:true}));
  saveDiary(d);
  const btn=document.getElementById(`confirm-btn-${mi}`);
  if(btn){btn.textContent='✓ Confirmado!';btn.style.background=C.gAcc;btn.style.color='#fff';btn.disabled=true;}
}

function renderDiarySection(mi){
  const items=getDiaryItems(mi);
  const el=document.getElementById(`diary-items-${mi}`);
  if(!el)return;
  if(!items.length){el.innerHTML='<div style="font-size:12px;color:var(--ts);text-align:center;padding:8px 0">Nenhum alimento registrado ainda.</div>';document.getElementById(`diary-totals-${mi}`).innerHTML='';document.getElementById(`diary-compare-${mi}`).innerHTML='';return;}
  el.innerHTML=`<div class="diary-items">${items.map((it,i)=>`<div class="diary-item"><span style="flex:1">${it.name}</span><span style="color:var(--ts)">${it.qty}g</span><span style="font-weight:600;color:var(--g);margin:0 6px">${it.kcal}kcal</span><button onclick="removeFoodEntry(${mi},${i})" style="background:none;border:none;cursor:pointer;color:var(--r);font-size:14px;padding:0 2px">×</button></div>`).join('')}</div>`;
  const tot=items.reduce((a,b)=>({kcal:a.kcal+b.kcal,p:+(a.p+b.p).toFixed(1),c:+(a.c+b.c).toFixed(1),f:+(a.f+b.f).toFixed(1)}),{kcal:0,p:0,c:0,f:0});
  document.getElementById(`diary-totals-${mi}`).innerHTML=`<span style="color:var(--g);font-weight:600">${tot.kcal} kcal</span><span style="color:${C.b};font-weight:500">${tot.p}g prot</span><span style="color:${C.a};font-weight:500">${tot.c}g carb</span><span style="color:${C.r};font-weight:500">${tot.f}g gord</span>`;
  // Compare with planned
  const key=S.week*7+S.mday;const meal=MEALS[key][mi];const mc=getCurMC();const ch=mc[mi]||'A';const planned=ch==='A'?meal.A:meal.B;
  const diffK=tot.kcal-planned.k;
  document.getElementById(`diary-compare-${mi}`).innerHTML=`<span style="font-size:11px;color:var(--ts)">Planejado: ${planned.k}kcal · Real: ${tot.kcal}kcal · <b style="color:${Math.abs(diffK)<100?C.g:C.r}">${diffK>0?'+':''}${diffK}kcal</b></span>`;
}

      <div style="width:8px;height:8px;border-radius:50%;background:#1D9E75;flex-shrink:0"></div>

    <div style="font-size:12px;color:var(--ts);margin-bottom:10px">${ph.mo} · ${wd.du} · ${wd.fm}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${wd.ex.map(e=>`<span style="font-size:10px;padding:3px 9px;border-radius:10px;background:var(--bg2);border:0.5px solid var(--bd);color:var(--ts)">${e.n.split(' ')[0]}</span>`).join('')}</div>
    ${isToday?`<button onclick="go('treino')" style="margin-top:10px;padding:8px 16px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;background:#1D9E75;color:#fff;border:none;width:100%">Iniciar treino de hoje →</button>`:''}

// RENDER TREINO
function renderTreino(){
  var ph=PH[S.phase];
  var phaseBtns='';
  [1,2,3,4].forEach(function(n){
    var on=S.phase===n;
    phaseBtns+='<button class="'+(on?'on':'')+'" style="'+(on?'background:'+PH[n].bg+';color:'+PH[n].tx+';':'')+'" onclick="selPhase('+n+')">Fase '+n+'</button>';
  });
  document.getElementById('phase-seg').innerHTML=phaseBtns;
  var days=PHASES[S.phase]?PHASES[S.phase].days:[];
  if(S.day>=days.length)S.day=0;
  var wd=days[S.day]||days[0];
  if(!wd){document.getElementById('workout-card').innerHTML='<p style="padding:1rem;color:var(--ts)">Dia nao encontrado.</p>';return;}
  var banner=document.getElementById('phase-banner');
  banner.style.background=ph.bg;
  banner.innerHTML='<div><div style="font-size:11px;font-weight:600;color:'+ph.tx+';margin-bottom:3px">'+ph.mo+'</div><div style="font-size:16px;font-weight:700;color:#1a1a1a">'+ph.nm+'</div></div><span style="font-size:11px;color:'+ph.tx+';font-weight:600">'+wd.du+'</span>';
  var pillsHtml='';
  DN.forEach(function(d,i){
    var on=S.day===i;
    var st=on?'background:'+ph.bg+';color:'+ph.tx+';border-color:'+ph.ac+';':'';
    pillsHtml+='<span class="pill '+(on?'on':'')+'" onclick="selDay('+i+')" style="'+st+'">'+d+'</span>';
  });
  document.getElementById('day-pills').innerHTML=pillsHtml;
  var cur=getCurWD();
  var exArr=wd.ex||[];
  var done=exArr.filter(function(_,i){return cur.ch&&cur.ch[i];}).length;
  var total=exArr.length;
  var pct=total>0?Math.round(done/total*100):0;
  var lastSess=getLastSession(S.phase,S.day);
  var exHtml='';
  exArr.forEach(function(e,i){
    var ck=!!(cur.ch&&cur.ch[i]);
    var lastKg=(lastSess&&lastSess[i])?'Semana passada: '+lastSess[i]+' kg':'';
    var nota=(cur.no&&cur.no[i])||'';
    var kg=(cur.wt&&cur.wt[i])||'';
    var chkSt=ck?'background:#1D9E75;border-color:#1D9E75;':'border-color:var(--bd);';
    exHtml+='<div class="ex-row">';
    exHtml+='<div class="chk '+(ck?'ck':'')+'" onclick="toggleEx('+i+')" style="'+chkSt+'">'+(ck?chkSVG():'')+'</div>';
    exHtml+='<div style="opacity:'+(ck?'.4':'1')+';min-width:0;flex:1">';
    exHtml+='<div class="ex-name '+(ck?'ck':'')+'">'+(e.n||'')+'</div>';
    exHtml+='<div class="ex-sets" style="color:#1D9E75">'+(e.s||'')+'</div>';
    exHtml+='<div class="ex-tip">'+(e.t||'')+'</div>';
    if(lastKg)exHtml+='<div class="last-sess">&uarr; '+lastKg+'</div>';
    exHtml+='<input class="nota-inp" type="text" placeholder="Nota livre..." value="'+nota+'" oninput="setNota('+i+',this.value)">';
    exHtml+='</div>';
    exHtml+='<div class="ex-fields"><div class="fwu">';
    exHtml+='<input type="number" step="0.5" placeholder="0" value="'+kg+'" oninput="setKg('+i+',this.value)">';
    exHtml+='<span class="fu">kg</span>';
    exHtml+='</div></div></div>';
  });
  document.getElementById('workout-card').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">'
    +'<div><div style="font-size:16px;font-weight:700;color:var(--text)">'+wd.nm+'</div>'
    +'<div style="font-size:12px;color:var(--ts);margin-top:3px">'+wd.fm+'</div></div>'
    +'<span style="font-size:13px;font-weight:700;color:'+ph.tx+'">'+done+'/'+total+'</span>'
    +'</div>'
    +'<div class="pbar-wrap"><div class="pbar" style="width:'+pct+'%;background:'+ph.ac+'"></div></div>'
    +exHtml;
  var okEl=document.getElementById('workout-ok');
  if(done===total&&done>0){
    okEl.innerHTML='<div class="ok-msg" style="background:'+ph.bg+';border:1px solid '+ph.ac+';color:'+ph.tx+'">'
      +'Treino concluido! '
      +'<button onclick="logWorkout()" style="margin-left:8px;padding:4px 12px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;background:'+ph.ac+';color:#fff;border:none">Registrar na timeline</button>'
      +'</div>';
  } else {okEl.innerHTML='';}
}

function logWorkout(){
  const wd=PHASES[S.phase].days[S.day];const cur=getCurWD();
  const done=wd.ex.filter((_,i)=>cur.ch[i]).length;
  const log=getLog();const date=today();
  const idx=log.findIndex(e=>e.date===date&&e.phase===S.phase&&e.day===S.day);
  const entry={date,phase:S.phase,day:S.day,dayName:DN[S.day],nm:wd.nm,done,total:wd.ex.length,note:'',exercises:wd.ex.map((e,i)=>({...e,kg:cur.wt[i]||'',nota:cur.no[i]||'',checked:!!cur.ch[i]}))};
  if(idx>=0)log[idx]=entry;else log.unshift(entry);
  saveLog(log);
  document.getElementById('workout-ok').innerHTML+=`<div style="text-align:center;font-size:12px;color:${C.g};margin-top:6px;font-weight:500">✓ Registrado na timeline!</div>`;
}

function addFoodEntry(dkey){
  const name=document.getElementById(`fn-${dkey}`).value.trim();
  const qty=parseFloat(document.getElementById(`fq-${dkey}`).value)||0;
  const kcalPer=parseFloat(document.getElementById(`fk-${dkey}`).value)||0;
  const pPer=parseFloat(document.getElementById(`fp-${dkey}`).value)||0;
  const cPer=parseFloat(document.getElementById(`fc-${dkey}`).value)||0;
  const fPer=parseFloat(document.getElementById(`ff-${dkey}`).value)||0;
  if(!name||qty<=0||kcalPer<=0){alert('Informe o alimento, a quantidade (g) e as kcal/100g.');return;}
  const factor=qty/100;
  const kcal=Math.round(kcalPer*factor);const p=+(pPer*factor).toFixed(1);const c=+(cPer*factor).toFixed(1);const f=+(fPer*factor).toFixed(1);
  const d=getDiary();const items=d[`today_${dkey}`]||[];
  items.push({name,qty,kcal,p,c,f});
  d[`today_${dkey}`]=items;saveDiary(d);
  ['fn','fq','fk','fp','fc','ff'].forEach(id=>{const el=document.getElementById(`${id}-${dkey}`);if(el)el.value='';});

}

function removeFoodEntry(dkey,idx){const d=getDiary();const k=`today_${dkey}`;const items=d[k]||[];items.splice(idx,1);d[k]=items;saveDiary(d);renderDiarySection(dkey);}

function renderDiarySection(dkey){
  const d=getDiary();const items=d[`today_${dkey}`]||[];

  if(!items.length){el.innerHTML='<div style="font-size:12px;color:var(--ts);padding:6px 0 2px">Nenhum alimento adicionado.</div>';document.getElementById(`diary-totals-${dkey}`).innerHTML='';document.getElementById(`diary-compare-${dkey}`).innerHTML='';return;}
  el.innerHTML=`<div class="diary-items">${items.map((it,i)=>`<div class="diary-item"><span style="flex:1;color:var(--text)">${it.name}</span><span style="color:var(--ts)">${it.qty}g</span><span style="font-weight:600;color:var(--g);margin:0 8px">${it.kcal}kcal</span><button onclick="removeFoodEntry('${dkey}',${i})" style="background:none;border:none;cursor:pointer;color:var(--r);font-size:16px;padding:0">×</button></div>`).join('')}</div>`;
  const tot=items.reduce((a,b)=>({kcal:a.kcal+b.kcal,p:+(a.p+b.p).toFixed(1),c:+(a.c+b.c).toFixed(1),f:+(a.f+b.f).toFixed(1)}),{kcal:0,p:0,c:0,f:0});
  document.getElementById(`diary-totals-${dkey}`).innerHTML=`<span style="color:var(--g);font-weight:700">${tot.kcal} kcal total</span><span style="color:${C.b};font-weight:500">${tot.p}g prot</span><span style="color:${C.a};font-weight:500">${tot.c}g carb</span><span style="color:${C.r};font-weight:500">${tot.f}g gord</span>`;
  // get planned from current choice
  const parts=dkey.split('_');const mi=parseInt(parts[parts.length-1]);const wk=S.week*7+S.mday;const meal=MEALS[wk]?.[mi];

}

function confirmMealDiary(dkey){

function renderRGordura(el){
  const metrics=getMetrics();
  const last=metrics[0]||{};
  const cintura=parseFloat(last.cintura)||0;
  const altura=180;const peso=parseFloat(last.peso)||0;
  // Navy formula (male): %BF = 495/(1.0324 - 0.19077×log10(cintura-pescoco) + 0.15456×log10(altura)) - 450
  // Simplified (without neck — use cintura only with adjustment)
  // Using Jackson-Pollock estimate with waist
  const pBF=cintura&&peso?Math.max(3,Math.min(40,(495/(1.0324-0.19077*Math.log10(cintura-36)+0.15456*Math.log10(altura))-450))):null;
  const massaGorda=pBF&&peso?(peso*pBF/100).toFixed(1):null;
  const massaMagra=pBF&&peso?(peso*(1-pBF/100)).toFixed(1):null;
  const cat=pBF?pBF<10?{l:'Atlético',c:'#0F6E56'}:pBF<17?{l:'Boa forma',c:'#1D9E75'}:pBF<25?{l:'Aceitável',c:'#BA7517'}:{l:'Acima do ideal',c:'#993556'}:{l:'—',c:'var(--ts)'};
  el.innerHTML=`<div class="card">
    <span class="st">Estimativa de gordura corporal · Fórmula da Marinha Americana</span>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      ${pBF?[
        {v:pBF.toFixed(1)+'%',l:'% de gordura',c:cat.c},
        {v:cat.l,l:'Categoria',c:cat.c},
        {v:massaGorda+' kg',l:'Massa gorda',c:C.r},
        {v:massaMagra+' kg',l:'Massa magra',c:'#1D9E75'}
      ].map(s=>`<div style="background:var(--bg2);border:0.5px solid var(--bd);border-radius:10px;padding:12px"><div style="font-size:18px;font-weight:600;color:${s.c}">${s.v}</div><div style="font-size:10px;color:var(--ts);margin-top:2px">${s.l}</div></div>`).join(''):
      `<div style="grid-column:span 2;background:var(--bg2);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--ts)">Registre cintura e peso em <b>Corpo</b> para calcular.</div>`}
    </div>
    <div style="background:var(--bg2);border-radius:10px;padding:12px;font-size:12px;color:var(--ts);line-height:1.7">
      <b style="color:var(--text)">Referências masculinas:</b><br>
      Atlético &lt;10% · Boa forma 10–17% · Aceitável 17–25% · Acima do ideal &gt;25%<br><br>
      Cálculo baseado na circunferência de cintura (${cintura||'?'} cm) e altura (${altura} cm). Para maior precisão, registre pescoço nas métricas corporais.
    </div>
  </div>`;
}

function getChallenges(){return LS.get('ft_challenges',[]);}
function saveChallenges(d){LS.set('ft_challenges',d);}
var CH_TYPES={
  consecutive_days:{l:'Dias consecutivos',u:'dias',auto:false},
  workout_count:{l:'Numero de treinos',u:'treinos',auto:true},
  exercise_weight:{l:'Carga num exercicio (atingir X kg)',u:'kg',auto:true},
  body_weight_lose:{l:'Perda de peso (perder X kg)',u:'kg',auto:true},
  body_weight_reach:{l:'Peso alvo (atingir X kg)',u:'kg',auto:true},
  protein_daily:{l:'Proteina diaria (meta por X dias)',u:'dias',auto:false},
  free:{l:'Meta livre',u:'',auto:false}
};
function calcChProgress(ch){
  var log=getLog();var metrics=getMetrics();
  if(ch.type==='workout_count'){
    var sd=ch.startDate?pDate(ch.startDate):new Date(0);
    var n=log.filter(function(e){return e.done>0&&pDate(e.date)>=sd;}).length;
    return {cur:n,pct:Math.min(100,Math.round(n/ch.target*100)),label:n+' de '+ch.target+' treinos'};
  }
  if(ch.type==='exercise_weight'){
    var max=0;
    log.forEach(function(e){(e.exercises||[]).forEach(function(ex){if(ex.n===ch.exerciseName&&ex.kg)max=Math.max(max,parseFloat(ex.kg)||0);});});
    return {cur:max,pct:Math.min(100,Math.round(max/ch.target*100)),label:max+'kg de '+ch.target+'kg'};
  }
  if(ch.type==='body_weight_lose'||ch.type==='body_weight_reach'){
    var curr=metrics[0]?parseFloat(metrics[0].peso):0;
    if(!curr)return {cur:0,pct:0,label:'Sem metricas'};
    var start=ch.startWeight||curr;
    var lost=ch.type==='body_weight_lose'?Math.max(0,start-curr):Math.max(0,curr-start);
    return {cur:+lost.toFixed(1),pct:Math.min(100,Math.round(lost/ch.target*100)),label:lost.toFixed(1)+'kg (atual: '+curr+'kg)'};
  }
  if(ch.type==='consecutive_days'){
    var logs=ch.logs||[];var streak=0;
    for(var i=logs.length-1;i>=0;i--){if(logs[i].done)streak++;else break;}
    return {cur:streak,pct:Math.min(100,Math.round(streak/ch.target*100)),label:streak+' dias seguidos de '+ch.target,streak:streak};
  }
  var logs2=ch.logs||[];
  var n2=logs2.filter(function(l){return l.done;}).length;
  return {cur:n2,pct:Math.min(100,Math.round(n2/ch.target*100)),label:n2+' de '+ch.target+(ch.unit?' '+ch.unit:'')};
}
function getChStatus(ch){
  if(ch.status==='completed'||ch.status==='failed')return ch.status;
  var p=calcChProgress(ch);
  if(p.pct>=100)return 'completed';
  if(ch.endDate&&pDate(ch.endDate)<new Date())return 'failed';
  return 'active';
}
var S_CH={filter:'ativos',showForm:false,formType:'consecutive_days'};

  var chs=getChallenges();

  html+='<button class="ch-btn '+(S_CH.filter==='concluidos'?'on':'')+'" onclick="setChF(\'concluidos\')">Concluidos ('+done.length+')</button>';
  html+='<button class="ch-btn '+(S_CH.filter==='falhos'?'on':'')+'" onclick="setChF(\'falhos\')">Falhados ('+failed.length+')</button>';
  html+='</div>';

  html+='</div>';
  if(S_CH.showForm)html+=buildChForm();
  if(list.length===0){
    html+='<div style="text-align:center;padding:2.5rem;color:var(--ts)">';
    html+='<div style="font-size:32px;margin-bottom:8px">&#9733;</div>';
    html+='<div style="font-size:14px;font-weight:500;margin-bottom:4px">Nenhum desafio aqui</div>';
    html+='<div style="font-size:12px">Crie um desafio para comecar.</div>';

function buildChForm(){
  var typeOpts='<option value="">Selecione o tipo...</option>';
  Object.keys(CH_TYPES).forEach(function(k){
    typeOpts+='<option value="'+k+'"'+(S_CH.formType===k?' selected':'')+'>'+CH_TYPES[k].l+'</option>';
  });
  var isEx=S_CH.formType==='exercise_weight';
  var isFree=S_CH.formType==='free';
  var unit=(S_CH.formType&&CH_TYPES[S_CH.formType])?CH_TYPES[S_CH.formType].u:'';
  var exSugg='';
  var allEx=[];
  Object.keys(PHASES).forEach(function(pk){
    PHASES[pk].days.forEach(function(d){
      (d.ex||[]).forEach(function(e){if(allEx.indexOf(e.n)<0)allEx.push(e.n);});
    });
  });
  allEx.forEach(function(n){exSugg+='<option value="'+n+'"></option>';});
  var h='<div class="ch-form">';
  h+='<div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:12px">Novo desafio</div>';
  h+='<div class="ch-field"><label>Nome</label><input id="ch-nm" type="text" placeholder="Ex: 20 dias sem alcool..."></div>';
  h+='<div class="ch-field"><label>Descricao (opcional)</label><textarea id="ch-desc" style="min-height:50px;resize:vertical" placeholder="Descreva..."></textarea></div>';
  h+='<div class="ch-field"><label>Tipo de meta</label><select id="ch-type" onchange="updChForm()">'+typeOpts+'</select></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  h+='<div class="ch-field"><label>Meta ('+(unit||'numero')+')</label><input id="ch-target" type="number" placeholder="Ex: 20"></div>';
  if(isFree){h+='<div class="ch-field"><label>Unidade</label><input id="ch-unit" type="text" placeholder="Ex: km..."></div>';}
  else{h+='<div class="ch-field"><label>Inicio</label><input id="ch-start" type="text" placeholder="DD/MM/AAAA"></div>';}
  h+='</div>';
  if(isEx){h+='<div class="ch-field"><label>Exercicio</label><input id="ch-exname" type="text" list="ex-dl" placeholder="Ex: Supino com barra"><datalist id="ex-dl">'+exSugg+'</datalist></div>';}
  h+='<div class="ch-field"><label>Prazo final (opcional)</label><input id="ch-end" type="text" placeholder="DD/MM/AAAA"></div>';
  h+='<button onclick="saveChallenge()" style="width:100%;padding:10px;font-size:13px;border-radius:8px;cursor:pointer;background:var(--gBg);color:var(--g);border:0.5px solid var(--gAcc)">Criar desafio</button>';
  h+='</div>';
  return h;
}

function buildChCard(ch){
  var prog=calcChProgress(ch);
  var status=getChStatus(ch);
  var sc={active:C.g,completed:C.b,failed:C.r}[status]||C.g;
  var sl={active:'Ativo',completed:'Concluido',failed:'Falhado'}[status]||status;
  var bc=status==='completed'?C.b:status==='failed'?C.r:'#1D9E75';
  var daysLeft=ch.endDate?Math.max(0,Math.ceil((pDate(ch.endDate)-new Date())/86400000)):null;
  var todayStr=today();
  var doneToday=(ch.logs||[]).some(function(l){return l.date===todayStr&&l.done;});
  var isManual=CH_TYPES[ch.type]&&!CH_TYPES[ch.type].auto;
  var h='<div class="ch-card">';
  h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px">';
  h+='<div><div style="font-size:14px;font-weight:500;color:var(--text)">'+ch.nm+'</div>';
  if(prog.streak)h+='<div style="font-size:12px;color:var(--a)">Streak: '+prog.streak+' dias</div>';
  h+='</div>';
  h+='<span class="ch-badge" style="color:'+sc+';border-color:'+sc+'44;background:'+sc+'11">'+sl+'</span>';
  h+='</div>';
  if(ch.desc)h+='<div style="font-size:12px;color:var(--ts);margin-bottom:10px;line-height:1.5">'+ch.desc+'</div>';
  h+='<div style="margin-bottom:10px">';
  h+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px">';
  h+='<span style="color:var(--ts)">'+prog.label+'</span>';
  h+='<span style="font-weight:600;color:'+bc+'">'+prog.pct+'%</span></div>';
  h+='<div class="ch-bar"><div class="ch-bar-fill" style="width:'+prog.pct+'%;background:'+bc+'"></div></div>';
  h+='</div>';
  h+='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
  if(isManual&&status==='active'){
    h+='<button class="ch-btn '+(doneToday?'':'on')+'" onclick="logChDay(\''+ch.id+'\')" '+(doneToday?'disabled':'')+'>'+( doneToday?'Feito hoje':'+ Marcar hoje')+'</button>';
  }
  if(CH_TYPES[ch.type]&&CH_TYPES[ch.type].auto)h+='<span style="font-size:10px;color:var(--ts)">Auto-integrado</span>';
  if(daysLeft!==null)h+='<span style="font-size:11px;color:var(--ts)">'+(daysLeft>0?daysLeft+' dias':'Encerrado')+'</span>';
  h+='<button class="ch-btn" onclick="delChallenge(\''+ch.id+'\')" style="margin-left:auto;color:var(--r)">Del</button>';
  h+='</div>';
  if((ch.logs||[]).length>0){
    h+='<div style="margin-top:10px;border-top:0.5px solid var(--bd);padding-top:10px">';
    h+='<div style="font-size:10px;color:var(--ts);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Ultimos registros</div>';
    ch.logs.slice(-4).reverse().forEach(function(l){
      h+='<div style="display:flex;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--bd);font-size:12px">';
      h+='<span style="color:'+(l.done?'#1D9E75':'var(--ts)')+'">'+(l.done?'OK':'--')+'</span>';
      h+='<span style="flex:1">'+l.date+'</span>';
      if(l.note)h+='<span style="color:var(--ts);font-style:italic">'+l.note+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function setChF(f){S_CH.filter=f;renderDesafios();}
function toggleChForm(){S_CH.showForm=!S_CH.showForm;renderDesafios();}
function updChForm(){var el=document.getElementById('ch-type');if(el)S_CH.formType=el.value;renderDesafios();}

function saveChallenge(){
  var nm=((document.getElementById('ch-nm')||{}).value||'').trim();
  var type=((document.getElementById('ch-type')||{}).value||'');
  var target=parseFloat(((document.getElementById('ch-target')||{}).value)||0);
  if(!nm||!type||!target){alert('Preencha nome, tipo e meta.');return;}
  var desc=((document.getElementById('ch-desc')||{}).value||'').trim();
  var startDate=((document.getElementById('ch-start')||{}).value||'').trim()||today();
  var endDate=((document.getElementById('ch-end')||{}).value||'').trim()||'';
  var exerciseName=((document.getElementById('ch-exname')||{}).value||'').trim();
  var unit=CH_TYPES[type]?CH_TYPES[type].u:((document.getElementById('ch-unit')||{}).value||'').trim();
  var metrics=getMetrics();
  var startWeight=metrics[0]?parseFloat(metrics[0].peso):0;
  var ch={id:String(Date.now()),nm:nm,desc:desc,type:type,target:target,unit:unit,
    startDate:startDate,endDate:endDate,exerciseName:exerciseName,startWeight:startWeight,
    status:'active',logs:[],createdAt:Date.now()};
  var chs=getChallenges();chs.unshift(ch);saveChallenges(chs);
  S_CH.showForm=false;renderDesafios();
}

function logChDay(id){
  var chs=getChallenges();
  var idx=-1;for(var i=0;i<chs.length;i++){if(chs[i].id===id){idx=i;break;}}
  if(idx<0)return;
  var ch=chs[idx];var dt=today();
  var already=false;(ch.logs||[]).forEach(function(l){if(l.date===dt&&l.done)already=true;});
  if(already)return;
  if(!ch.logs)ch.logs=[];
  var note=prompt('Nota para hoje (opcional):','')||'';
  ch.logs.push({date:dt,done:true,value:'',note:note});
  chs[idx]=ch;saveChallenges(chs);renderDesafios();
}

function delChallenge(id){
  if(!confirm('Remover este desafio?'))return;
  var chs=getChallenges().filter(function(c){return c.id!==id;});
  saveChallenges(chs);renderDesafios();
}

function showSyncStatus(msg,cor){var el=document.getElementById('sync-status');if(el){el.textContent=msg;el.style.color=cor||C.g;setTimeout(function(){el.textContent='';},4000);}}
function syncFromSheets(){
  if(!GS_URL){var url=prompt('Cole aqui a URL do Apps Script:','');if(!url)return;GS_URL=url.trim();localStorage.setItem('ft_gs_url',GS_URL);}
  showSyncStatus('Conectando...');
  fetch(GS_URL+'?action=load&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(json){
      if(json.ok&&json.data){
        var count=Object.keys(json.data).length;
        Object.keys(json.data).forEach(function(k){localStorage.setItem(k,JSON.stringify(json.data[k]));});
        showSyncStatus('Sincronizado! '+count+' chaves. Recarregando...');
        setTimeout(function(){location.reload();},1500);
      } else {showSyncStatus('Erro: '+(json.error||'falha'),'#993556');}
    })
    .catch(function(e){showSyncStatus('Erro de conexao. Verifique a URL.','#993556');console.error(e);});
}
function saveToSheets(key,value){
  if(!GS_URL)return;
  fetch(GS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:key,value:value})})
    .catch(function(e){console.warn('Sheets save:',e);});
}
var _lsOrig=LS.set;
LS.set=function(k,v){_lsOrig(k,v);saveToSheets(k,v);};

// INIT
initTheme();
go('dashboard');

</script>
